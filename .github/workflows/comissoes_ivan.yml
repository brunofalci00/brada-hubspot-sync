name: Comissoes Ivan - dia 20 (5 frentes)

# Automacao da planilha OFICIAL de Comissoes do Ivan (1XVRuIMN...) no fecho do
# ciclo (dia 20). 5 frentes:
#   1. Controle de Vendas  (sheets_comissoes_ivan.py)      <- consolidado, append.
#   2. Controle de Cobrancas - Bia (sheets_cobrancas_bia.py) <- consolidado, upsert.
#   3. {Mes}_MATCH         (sheets_abas_mensais_ivan.py)   <- consolidado, aba do ciclo.
#   4. {Mes}_Elaboracao    (sheets_abas_mensais_ivan.py)   <- HubSpot direto.
#   5. Tabela Ricardo      (sheets_abas_mensais_ivan.py)   <- HubSpot direto.
# SO escreve colunas automaticas; comissoes ficam em branco (Luciana/Ricardo).
# Junho esta FECHADO (protecao: nao escreve em aba sem coluna tecnica deal_id).
on:
  # Cron do dia 20 DESATIVADO ate sign-off do Ivan (planilha = folha de
  # pagamento). Offset :30: o sync.yml roda no minuto :00 (clear+write no
  # consolidado); o guard MIN_ROWS_GUARD ja protege leitura parcial.
  # TODO ativar apos sign-off (cron roda em --write no ciclo corrente):
  # schedule:
  #   - cron: '30 12 20 * *'   # dia 20, 09:30 BRT
  workflow_dispatch:
    inputs:
      write:
        description: 'Gravar de verdade na planilha oficial? (false = dry-run + gate)'
        type: boolean
        default: false
      cycle:
        description: 'Ciclo YYYY-MM (vazio = ciclo corrente)'
        type: string
        default: ''

jobs:
  comissoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Testes unitarios (logica = folha)
        run: |
          python ops/_test_comissoes_ivan.py
          python ops/_test_abas_mensais_ivan.py
          python -m py_compile financeiro_match_common.py sheets_cobrancas_bia.py \n            hubspot_financeiro.py ops/criar_props_financeiro_cobrancas.py \n            ops/recuperar_elaboracao_atrasada.py

      - name: Definir ARGS (write/cycle)
        id: args
        run: |
          ARGS=""
          if [ "${{ inputs.write }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --write"
          fi
          if [ -n "${{ inputs.cycle }}" ]; then
            ARGS="$ARGS --cycle ${{ inputs.cycle }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Frente 1 — Controle de Vendas (consolidado)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # as 4 properties financeiras nao vem no consolidado: hubspot_financeiro
          # le direto da API. Sem o token, estas frentes abortam.
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          echo "sheets_comissoes_ivan.py ${{ steps.args.outputs.args }}"
          python sheets_comissoes_ivan.py ${{ steps.args.outputs.args }}

      - name: Frente 2 — Controle de Cobrancas - Bia (consolidado)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # as 4 properties financeiras nao vem no consolidado: hubspot_financeiro
          # le direto da API. Sem o token, estas frentes abortam.
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          echo "sheets_cobrancas_bia.py ${{ steps.args.outputs.args }}"
          python sheets_cobrancas_bia.py ${{ steps.args.outputs.args }}

      - name: Frentes 3-5 — {Mes}_MATCH + {Mes}_Elaboracao + Ricardo
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          echo "sheets_abas_mensais_ivan.py ${{ steps.args.outputs.args }}"
          python sheets_abas_mensais_ivan.py ${{ steps.args.outputs.args }}
